openapi: 3.1.0
info:
  title: Device API
  version: 1.0.0
  description: |
    API served by each device (transmitter or receiver) on the LAN, under /api/v1.
    The web UI is the only client. Names follow docs/terms.md: never expose
    implementation terms in paths, fields or codes.
    Times are ISO 8601 with offset (+09:00). Settings use optimistic locking with `version`.
    The WebSocket /api/v1/live (not describable in OpenAPI) is documented in docs/api.md and
    typed as `LiveMessage` in web/src/api/types.ts.
servers:
  - url: /api/v1
tags:
  - name: device
  - name: transport control
  - name: video settings
    description: Transmitter only. A receiver answers 409 unsupported_role.
  - name: transport settings
    description: |
      The transmitter's screen. A receiver answers them too (its screen is not designed yet), but it
      does not choose the delay: it follows the transmitter it is connected to (delay.follows_peer
      true, delay.profile the transmitter's of the current or last connection, standard before any;
      kept in memory only) and its check and PUT ignore delay. /transport/compare is transmitter
      only (a receiver answers 409 unsupported_role).
  - name: network settings
    description: |
      The devices on the way to the peer (途中の無線機), both roles. They are checked by
      reachability (つながりの確認) after the peer, and the radio line carries, besides the video,
      only the traffic with them. Allowed any time, also while live: applying does not touch the
      transmission.
  - name: network test
    description: |
      Checks of the line to the peer, started from the UI. reachability (つながりの確認): both roles,
      any time, also while live. throughput (回線の速さ): transmitter only (a receiver answers
      409 unsupported_role), only while the link is stopped, one at a time. It sends more than the
      line can carry (NetworkTestOptions.saturate_mbps) and measures what arrives (届いた速さ); a
      result towards the receiver can become the send cap (TransportSettings.send_limit) with
      POST /network-tests/{id}/use. The receiver answers throughput tests by itself whenever the
      device is running. Tests are kept in memory only.
  - name: preview
    description: |
      Live picture in the browser, only while the link is live. tx shows what it sends (after
      compression, a few seconds behind the input), rx what it outputs. The browser opens a
      receive-only peer connection, gathers its candidates (no external servers), posts the
      offer and applies the answer; there is no trickle. Close with DELETE when the screen
      stops showing it (another page, hidden tab, link no longer live).
paths:
  /device:
    get:
      tags: [device]
      summary: Identity of this device
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } }
  /status:
    get:
      tags: [device]
      summary: Link state, alerts and what the preview shows
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
  /stats:
    get:
      tags: [device]
      summary: Latest measurements (also pushed every second on /live)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Stats' } } } }
  /stats/history:
    get:
      tags: [device]
      summary: Sparkline data, oldest first, one point per interval
      parameters:
        - { name: window_s, in: query, schema: { type: integer, default: 300 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StatsHistory' } } } }
  /events:
    get:
      tags: [device]
      summary: Event log, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 500 } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeviceEvent' } } } }
  /preview/sessions:
    post:
      tags: [preview]
      summary: Open a preview session (offer in, answer out)
      description: |
        The device answers once it is ready to send (this can take a few seconds the first time).
        Errors: 409 not_live (the link is not live), 429 too_many_viewers (the device's viewer
        limit is reached), 400 bad_offer (missing, empty, not starting with "v=0" or over 64 KB),
        400 no_common_codec (the browser cannot play any of the preview's video formats),
        503 preview_unavailable (the preview is turned off or could not be prepared now).
        The transmission never depends on the preview.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewOffer' } } } }
      responses:
        '201': { description: Opened, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewSession' } } } }
        '400': { description: bad_offer or no_common_codec, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: not_live, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: too_many_viewers, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: preview_unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /preview/sessions/{id}:
    delete:
      tags: [preview]
      summary: Close a preview session
      description: Also 204 for an unknown or already closed id. The device also closes a session whose connection is lost.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Closed }
  /transport/start:
    post:
      tags: [transport control]
      summary: Start sending (tx) or receiving (rx)
      description: 409 busy while a throughput network test is running (tx).
      responses:
        '200': { description: New status, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
        '409': { description: busy, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /transport/stop:
    post:
      tags: [transport control]
      summary: Stop; no automatic reconnection until started again
      responses:
        '200': { description: New status, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
  /transport/retry:
    post:
      tags: [transport control]
      summary: Try to connect now instead of waiting for the next attempt
      responses:
        '200': { description: New status, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
  /transport/compare:
    get:
      tags: [transport settings]
      summary: Local settings next to what the peer reported when the link was negotiated
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CompareResult' } } } }
  /settings/video:
    get:
      tags: [video settings]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VideoSettings' } } } }
    put:
      tags: [video settings]
      summary: Apply. Returns once the device has switched over.
      description: |
        A new bitrate or mode is taken over without a gap in the picture (a few seconds).
        A new input sets the link up again (the receiver's picture stops for about 10 s).
        While the transport delay is low the fixed bitrate (encode.manual) is sent whatever the
        mode says; mode auto is stored and applies again when the delay is standard
        (VideoOptions.auto_available, impact low_delay_fixed).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VideoSettingsInput' } } } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/ApplyVideoResult' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/video/options:
    get:
      tags: [video settings]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VideoOptions' } } } }
  /settings/video/check:
    post:
      tags: [video settings]
      summary: Validate a draft and describe the impact of applying it. Changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VideoSettingsInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckResult' } } } }
  /settings/transport:
    get:
      tags: [transport settings]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TransportSettings' } } } }
    put:
      tags: [transport settings]
      summary: Apply. The link is re-established with the new settings.
      description: |
        A change of send_limit alone is stored and used from the next start of the transmission; it
        is accepted while the link runs too (impact takes_effect_next_start; the running transmission,
        its retries included, keeps its cap). The other fields keep their rules (the device may answer 409 busy while live). A new
        send_limit value becomes source "manual" and adds the event send_limit_changed.
        A new delay is used from the next transmission (the receiver follows it when the
        transmitter connects). The video settings are never changed by it. On a receiver delay
        is ignored.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransportSettingsInput' } } } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/ApplyTransportResult' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Conflict' }
  /settings/transport/options:
    get:
      tags: [transport settings]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TransportOptions' } } } }
  /settings/transport/check:
    post:
      tags: [transport settings]
      summary: Validate a draft and describe the impact of applying it. Changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TransportSettingsInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckResult' } } } }
  /settings/network:
    get:
      tags: [network settings]
      summary: The devices on the way (途中の無線機)
      description: |
        Until the list is first applied, the device's configured list (network_test.hops in its
        configuration file) is returned; once applied, the stored list is (kept across restarts).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkSettings' } } } }
    put:
      tags: [network settings]
      summary: Apply. Stored at once; the transmission is not touched (also while live).
      description: |
        Checks, in this order: 409 version_conflict → 400 invalid (the same field errors as
        /check). On success the list is stored, the version goes up, the event
        network_settings_applied is added and a `settings` message (section network) is pushed.
        The next reachability test checks the new list, and what the radio line may carry
        follows it. Returns the new settings.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkSettingsInput' } } } }
      responses:
        '200': { description: Applied, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkSettings' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { description: version_conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /settings/network/check:
    post:
      tags: [network settings]
      summary: Validate a draft and describe the impact of applying it. Changes nothing.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkSettingsInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckResult' } } } }
  /network-tests:
    post:
      tags: [network test]
      summary: Start a test
      description: |
        Answers at once with the running test; read GET /network-tests/{id} (or the list) until
        `state` is no longer `running`.
        Checks, in this order: 400 invalid (kind missing or unknown) → 409 unsupported_role
        (throughput on a receiver) → 400 invalid with field errors (direction: invalid; duration_s
        integer 5–30: out_of_range with min and max) → 409 busy. mode and rate_mbps (fields of an
        earlier version) are ignored.
        busy: throughput while the link is not `stopped` or while another throughput test runs;
        reachability while another reachability test runs.
        While a throughput test runs, POST /transport/start answers 409 busy.
        A throughput test that finishes adds the event network_test_done (mbps, direction).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkTestRequest' } } } }
      responses:
        '202': { description: Started, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkTest' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { description: busy or unsupported_role, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    get:
      tags: [network test]
      summary: The last 20 tests, newest first (memory only; empty after the device restarts)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkTestList' } } } }
  /network-tests/options:
    get:
      tags: [network test]
      summary: Limits of the throughput test and the rate it sends at
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkTestOptions' } } } }
  /network-tests/{id}:
    get:
      tags: [network test]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkTest' } } } }
        '404': { description: not_found (unknown, or no longer among the last 20), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /network-tests/{id}/use:
    post:
      tags: [network test]
      summary: Make a finished throughput test towards the peer the send cap (transmitter only)
      description: |
        Sets TransportSettings.send_limit to {mbps: throughput_mbps rounded to two decimals (the
        test's saturate_mbps when the result is not saturated; kept within 1.0–20.0), source:
        measured, measured_at: the test's finished_at, test_id: id}, bumps the transport settings
        version, adds the event send_limit_changed (mbps, from_mbps, source) and pushes a `settings`
        message. The next start of the transmission uses it; while live it is stored now and the
        running transmission keeps its cap. No body.
        Checks, in this order: 409 unsupported_role (receiver) → 404 not_found → 409 not_applicable
        (not a throughput test, not done, or direction not to_peer).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The new transport settings, content: { application/json: { schema: { $ref: '#/components/schemas/TransportSettings' } } } }
        '404': { description: not_found (unknown, or no longer among the last 20), content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: not_applicable or unsupported_role, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

components:
  responses:
    Invalid:
      description: The input has errors (same codes as /check)
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: version_conflict (settings changed since they were read), busy, or unsupported_role
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    Role: { type: string, enum: [tx, rx] }
    Level: { type: string, enum: [info, warn, error] }
    Params:
      type: object
      additionalProperties: { oneOf: [{ type: number }, { type: string }] }
    Device:
      type: object
      required: [id, role, address, firmware, serial, timezone]
      properties:
        id: { type: string, examples: [TX-01] }
        role: { $ref: '#/components/schemas/Role' }
        address: { type: string, examples: [192.168.10.21] }
        firmware: { type: string }
        serial: { type: string }
        timezone: { type: string, examples: [Asia/Tokyo] }
    LinkState:
      type: string
      enum: [live, connecting, reconnecting, listening, stopped]
      description: 伝送中/受信中, 接続中, 再接続中, 待ち受け中, 停止中
    Peer:
      type: object
      required: [id, address, port]
      properties:
        id: { type: [string, 'null'] }
        address: { type: string }
        port: { type: integer }
    Alert:
      type: object
      description: |
        delay_margin_low (tx, warn): params margin_s. The margin before the receiver's picture would stop is below Stats.delay_margin_warn_s (about 3 s).
        video_stalled (rx, warn): params count, seconds, window_s. The picture stopped in the last window_s seconds.
        loss_high (warn): params loss_pct, threshold_pct. Not raised in the standard delay profile, where losses are recovered by resending.
        peer_rejected_passphrase (error): kept for when encryption is available.
        peer_unreachable (error, tx), input_lost (error, tx).
        Alerts are not dismissed automatically; they clear when the cause clears.
      required: [level, code, since]
      properties:
        level: { type: string, enum: [warn, error] }
        code: { type: string, enum: [delay_margin_low, video_stalled, loss_high, peer_rejected_passphrase, peer_unreachable, input_lost] }
        since: { type: string, format: date-time }
        params: { $ref: '#/components/schemas/Params' }
    Media:
      type: object
      description: The picture of the operation screen. tx its input (the preview shows it as sent), rx its output.
      required: [kind, label, format, audio, black]
      properties:
        kind: { type: string, enum: [camera, file, output] }
        label: { type: string, description: 'a name the operator recognises: the camera name, the file name (no folder), or the output', examples: [Facecam 4K, sample_2160p30.y4m, OUT 1] }
        format: { type: [string, 'null'], description: 'width×height, U+3000, frame rate', examples: ['3840×2160　30p'] }
        audio: { type: string, enum: [none] }
        black: { type: boolean }
    Status:
      type: object
      required: [server_time, state, since, live_s, attempt, next_retry_s, last_live_until, peer, listen_port, alerts, media]
      properties:
        server_time: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/LinkState' }
        since: { type: string, format: date-time }
        live_s: { type: [integer, 'null'] }
        attempt: { type: [integer, 'null'] }
        next_retry_s: { type: [integer, 'null'] }
        last_live_until: { type: [string, 'null'], format: date-time }
        peer: { $ref: '#/components/schemas/Peer' }
        listen_port: { type: [integer, 'null'] }
        alerts: { type: array, items: { $ref: '#/components/schemas/Alert' } }
        media: { $ref: '#/components/schemas/Media' }
    DelayProfile:
      type: string
      enum: [standard, low]
      description: |
        standard: about 10 s from capture to display; tolerant of a bad line; automatic quality works.
        low: about 1.5 s; picture quality fixed (encode.manual, whatever encode.mode says); a bad line
        makes the picture stop, or the receiver's delay grow, more easily.
        Chosen on the transmitter; the receiver follows the transmitter it is connected to.
    Stats:
      type: object
      description: Fields that do not apply to the role, or cannot be measured now, are null.
      required: [at, delay_profile, delay_target_ms, loss_pct, loss_threshold_pct, rtt_ms, last_rtt_ms, retrans_pct, send_mbps, target_mbps, actual_mbps, bandwidth_mbps, send_late_5m, delay_margin_s, delay_margin_warn_s, recv_mbps, stalls_5m, stall_s_5m, video_latency_ms, unrecovered_5m]
      properties:
        at: { type: string, format: date-time }
        delay_profile: { $ref: '#/components/schemas/DelayProfile', description: "the profile in effect; rx: the transmitter's of the current or last connection" }
        delay_target_ms: { type: integer, description: "target delay of the profile in effect, capture to display; rx: plus what the receiver has added on its own since the transmitter connected (it waits longer when frames come late), to 100 ms", examples: [9500] }
        loss_pct: { type: [number, 'null'], description: 'line loss; tx: resent ÷ sent packets, rx: lost ÷ expected packets' }
        loss_threshold_pct: { type: [number, 'null'], description: above this loss_high is raised; null while losses are recovered by resending (standard profile) }
        rtt_ms: { type: [number, 'null'] }
        last_rtt_ms: { type: [number, 'null'] }
        retrans_pct: { type: [number, 'null'], description: rx only (share of packets that arrived by resending); null on tx }
        send_mbps: { type: [number, 'null'], description: "tx; what goes out on the line, resends included (6 s mean)" }
        target_mbps: { type: [number, 'null'], description: tx; video bitrate aimed at now (automatic step or the fixed value) }
        actual_mbps: { type: [number, 'null'], description: 'tx; video bitrate actually produced: mean of the last 3 keyframe intervals (about 6 s)' }
        bandwidth_mbps: { type: [number, 'null'], description: "tx; estimated line capacity, only measurable while the line is crowded (null while the device's own sending cap is the limit)" }
        send_late_5m: { type: [integer, 'null'], description: "tx; packets that could not be sent in time, last 5 min" }
        delay_margin_s: { type: [number, 'null'], description: "tx; seconds left before the receiver's picture would stop (about 6 s normally); one decimal rounded down, the same value as delay_margin_low.margin_s. null in the low profile" }
        delay_margin_warn_s: { type: [number, 'null'], description: "tx; delay_margin_low is raised below this margin (about 3 s in the standard profile); null on rx and in the low profile (no margin, no warning)", examples: [3] }
        recv_mbps: { type: [number, 'null'], description: rx; what arrives (6 s mean) }
        stalls_5m: { type: [integer, 'null'], description: "rx; times the picture stopped, last 5 min" }
        stall_s_5m: { type: [number, 'null'], description: "rx; total seconds the picture stood still, last 5 min" }
        video_latency_ms: { type: [number, 'null'], description: "rx; measured capture-to-display delay, null until really measured (the UI then shows delay_target_ms as an estimate)" }
        unrecovered_5m: { type: [integer, 'null'], description: "rx; packets that could not be recovered, last 5 min" }
    StatsHistory:
      type: object
      required: [interval_s, end, series]
      properties:
        interval_s: { type: integer, examples: [5] }
        end: { type: string, format: date-time }
        series:
          type: object
          description: send_mbps, recv_mbps, target_mbps, actual_mbps, loss_pct, rtt_ms, bandwidth_mbps, delay_margin_s (tx), stall_s (rx; seconds the picture stood still in each interval)
          additionalProperties: { type: array, items: { type: [number, 'null'] } }
    DeviceEvent:
      type: object
      required: [id, at, level, code]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        level: { $ref: '#/components/schemas/Level' }
        code:
          type: string
          enum: [delay_margin_low, video_stalled, loss_high, peer_rejected_passphrase, peer_disconnected, peer_connected, transport_started, transport_stopped, listening_started, input_detected, device_started, bitrate_changed, video_settings_applied, transport_settings_applied, passphrase_changed, network_test_done, send_limit_changed, network_settings_applied]
        params:
          $ref: '#/components/schemas/Params'
          description: |
            delay_margin_low: margin_s. video_stalled: seconds. loss_high: loss_pct.
            bitrate_changed: mbps, from_mbps, reason (BitrateReason). transport_started (rx): format.
            listening_started: port. input_detected: format.
            network_test_done: mbps (what arrived, ThroughputResult.throughput_mbps with two decimals), direction (to_peer | from_peer); only after a throughput test that finished.
            send_limit_changed (tx): mbps, from_mbps, source (measured: POST /network-tests/{id}/use; manual: PUT /settings/transport).
            network_settings_applied: no params (PUT /settings/network).
    BitrateReason:
      type: string
      enum: [loss, delay, recovered, manual]
      description: |
        Why the video bitrate changed. loss: the line got crowded and losses grew (down).
        delay: sending fell behind (down). recovered: the line has room again (up).
        manual: an operator changed the bitrate or the mode.
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'dotted path of the input field; list items by index from 0', examples: [encode.manual.bitrate_mbps, delay.profile, send_limit.mbps, 'hops[1].address'] }
        code:
          type: string
          enum: [out_of_range, required, too_short, too_long, too_many, invalid, duplicate, is_self, is_peer]
          description: |
            too_many: a list is longer than params.max. duplicate: the same value as an earlier item.
            is_self: an address of this device. is_peer: the peer's address. (The last three for
            hops[i].address, see NetworkSettingsInput.)
        params: { $ref: '#/components/schemas/Params' }
    Impact:
      type: object
      required: [level, code]
      properties:
        level: { type: string, enum: [warn, ok, info] }
        code:
          type: string
          enum: [input_switch_gap, switch_no_gap, manual_fixed, auto_decides, bitrate_lower_quality, bitrate_near_bandwidth, reconnect, reconnect_gap, no_peer_effect, saved_while_stopped, takes_effect_next_start, hops_changed, low_delay_fixed, low_delay_effects]
        params:
          $ref: '#/components/schemas/Params'
          description: |
            input_switch_gap: gap_s (a new input while live sets the link up again; reconnect_gap comes with it and the UI shows the pair as one line).
            reconnect_gap: gap_s (seconds the receiver's picture is gone while the link is set up again; about the delay of the profile).
            switch_no_gap: a new bitrate or mode is taken over without a gap.
            bitrate_near_bandwidth: bandwidth_mbps (the fixed bitrate is above 0.8 × the estimated capacity).
            takes_effect_next_start (info): send_limit changes and nothing else does, while the link is not stopped (live, connecting, reconnecting); it is stored and used from the next start (retries keep the cap they started with).
            hops_changed (info, network settings): the list differs from the applied one; reachability and what the radio line may carry follow the new list. Nothing else is affected (the transmission is not touched).
            low_delay_fixed (info): bitrate_mbps (encode.manual.bitrate_mbps). Low delay sends this fixed bitrate whatever the video mode says. Transport: the delay changes to low while the applied video mode is auto. Video: the draft's mode is auto while low is applied (not an error; auto applies again when the delay is standard). While low is applied, a change of the mode alone does not change what is sent (no switch_no_gap, no auto_decides).
            low_delay_effects (info, transport): the delay changes to low; on a busy line the receiver's delay may grow (it comes back slowly once the line is quiet).
    CheckResult:
      type: object
      required: [ok, errors, impacts]
      properties:
        ok: { type: boolean }
        errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
        impacts: { type: array, items: { $ref: '#/components/schemas/Impact' } }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [version_conflict, invalid, busy, not_found, unsupported_role, not_applicable, not_live, too_many_viewers, bad_offer, no_common_codec, preview_unavailable]
            errors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }
    PreviewOffer:
      type: object
      required: [offer]
      properties:
        offer: { type: string, maxLength: 65536, description: 'session description of a receive-only video offer, candidates included; starts with "v=0"' }
    PreviewSession:
      type: object
      required: [id, answer]
      properties:
        id: { type: string, description: opaque; used to close the session }
        answer: { type: string, description: "the device's session description, candidates included" }
    EncodeParams:
      type: object
      description: The only encoding parameter that can be chosen. Everything else is fixed (VideoOptions.encoding).
      required: [bitrate_mbps]
      properties:
        bitrate_mbps: { type: number, minimum: 1.5, maximum: 4.0 }
    VideoInput:
      type: object
      required: [kind, camera, file, loop]
      properties:
        kind: { type: string, enum: [camera, file] }
        camera: { type: string, description: device path; the UI shows the camera label instead, examples: [/dev/video0] }
        file: { type: string, description: full path; the UI shows only the file name, examples: [/srv/media/sample_2160p30.y4m] }
        loop: { type: boolean, description: only when VideoOptions.loop_available; otherwise false }
    VideoSettings:
      type: object
      required: [version, input, encode, audio]
      properties:
        version: { type: integer }
        input: { $ref: '#/components/schemas/VideoInput' }
        encode:
          type: object
          required: [mode, manual, auto]
          properties:
            mode:
              type: string
              enum: [auto, manual]
              description: auto lowers the bitrate when the line gets crowded and raises it when there is room; manual keeps it fixed
            manual: { $ref: '#/components/schemas/EncodeParams' }
            auto: { $ref: '#/components/schemas/EncodeParams', description: read only — the bitrate auto mode aims at now (live value in Stats.target_mbps) }
        audio:
          type: object
          properties: { enabled: { type: boolean, const: false } }
    VideoSettingsInput:
      type: object
      required: [version, input, encode]
      properties:
        version: { type: integer }
        input: { $ref: '#/components/schemas/VideoInput' }
        encode:
          type: object
          required: [mode, manual]
          properties:
            mode: { type: string, enum: [auto, manual] }
            manual: { $ref: '#/components/schemas/EncodeParams' }
    VideoEncoding:
      type: object
      description: Fixed encoding, shown read-only. "source" means the same as the input.
      required: [codec, resolution, framerate, keyframe_s]
      properties:
        codec: { type: string, enum: [av1] }
        resolution: { type: string, enum: [source] }
        framerate: { type: string, enum: [source] }
        keyframe_s: { type: number, examples: [2] }
    VideoOptions:
      type: object
      required: [cameras, files, loop_available, auto_available, bitrate_range_mbps, encoding, bandwidth_mbps]
      properties:
        cameras:
          type: array
          items:
            type: object
            required: [device, label, signal]
            properties:
              device: { type: string }
              label: { type: string }
              signal: { type: [string, 'null'], description: 'width×height, U+3000, frame rate', examples: ['3840×2160　30p'] }
        files:
          type: array
          items:
            type: object
            required: [path, format, duration_s]
            properties:
              path: { type: string }
              format: { type: string, examples: ['3840×2160　30p'] }
              duration_s: { type: integer }
        loop_available: { type: boolean, description: false while files can only be played once }
        auto_available:
          type: boolean
          description: |
            false while the applied transport delay is low: the fixed bitrate (encode.manual) is sent
            and auto is not in effect, whatever encode.mode says. The stored mode is kept and applies
            again when the delay is standard.
        bitrate_range_mbps: { type: array, items: { type: number }, minItems: 2, maxItems: 2, examples: [[1.5, 4.0]] }
        encoding: { $ref: '#/components/schemas/VideoEncoding' }
        bandwidth_mbps: { type: [number, 'null'], description: "estimated line capacity; null unless the line is crowded" }
    ApplyVideoResult:
      type: object
      required: [settings, applied_at, impacts]
      properties:
        settings: { $ref: '#/components/schemas/VideoSettings' }
        applied_at: { type: string, format: date-time }
        impacts: { type: array, items: { $ref: '#/components/schemas/Impact' } }
    TransportMode: { type: string, enum: [outbound, inbound, mutual], description: 送信機から接続 / 接続を待つ / 互いに接続 }
    Cipher: { type: string, enum: [aes-128, aes-192, aes-256, none] }
    SendLimitSource:
      type: string
      enum: [default, measured, manual]
      description: 'default: the initial value (5.0). measured: from a line-speed test (POST /network-tests/{id}/use). manual: entered in the transport settings.'
    SendLimit:
      type: object
      description: |
        送り出しの上限: the most the transmitter puts on the line. Each transmission starts with it;
        while the line is crowded the device paces below it on its own and comes back up to it.
        Kept across restarts.
      required: [mbps, source, measured_at, test_id]
      properties:
        mbps: { type: number, minimum: 1.0, maximum: 20.0, description: two decimals, examples: [5.26] }
        source: { $ref: '#/components/schemas/SendLimitSource' }
        measured_at: { type: [string, 'null'], format: date-time, description: 'measured: when the test finished; otherwise null' }
        test_id: { type: [string, 'null'], description: 'measured: the test it came from; otherwise null' }
    TransportSettings:
      type: object
      required: [version, mode, peer, listen_port, delay, encryption, send_limit]
      properties:
        version: { type: integer }
        mode: { $ref: '#/components/schemas/TransportMode' }
        peer:
          type: object
          required: [host, port]
          properties: { host: { type: string }, port: { type: integer } }
        listen_port: { type: integer }
        delay:
          type: object
          required: [profile, follows_peer]
          properties:
            profile: { $ref: '#/components/schemas/DelayProfile' }
            follows_peer:
              type: boolean
              description: |
                false on the transmitter (the delay is chosen here). true on the receiver: profile
                is the transmitter's of the current or last connection (standard before any; kept
                in memory only), and a check or PUT ignores delay.
        encryption:
          type: object
          required: [cipher, passphrase_set, passphrase_rejected_at]
          properties:
            cipher: { $ref: '#/components/schemas/Cipher' }
            passphrase_set: { type: boolean, description: the passphrase itself is never returned }
            passphrase_rejected_at: { type: [string, 'null'], format: date-time }
        send_limit: { $ref: '#/components/schemas/SendLimit' }
    TransportSettingsInput:
      type: object
      required: [version, mode, peer, listen_port, delay, encryption]
      properties:
        version: { type: integer }
        mode: { $ref: '#/components/schemas/TransportMode', description: one of TransportOptions.modes }
        peer:
          type: object
          required: [host, port]
          properties: { host: { type: string }, port: { type: integer } }
        listen_port: { type: integer }
        delay:
          type: object
          required: [profile]
          properties:
            profile: { $ref: '#/components/schemas/DelayProfile', description: one of TransportOptions.delay_profiles with available=true; ignored on a receiver }
        encryption:
          type: object
          required: [cipher]
          properties:
            cipher: { $ref: '#/components/schemas/Cipher', description: one of TransportOptions.ciphers }
            passphrase: { type: string, writeOnly: true, description: omit to keep the current value; ignored while cipher is none }
        send_limit:
          type: object
          description: |
            Omit to keep the current value. 1.0–20.0 (out_of_range with min and max, field
            send_limit.mbps), two decimals. A new value becomes source manual (measured_at and
            test_id null); the same value keeps its source. While live, a change of this field
            alone is accepted (impact takes_effect_next_start).
          required: [mbps]
          properties:
            mbps: { type: number, minimum: 1.0, maximum: 20.0 }
    TransportOptions:
      type: object
      description: What can be chosen. The UI shows a control with a single choice as plain text.
      required: [modes, ciphers, delay_profiles]
      properties:
        modes: { type: array, items: { $ref: '#/components/schemas/TransportMode' }, examples: [[outbound]] }
        ciphers: { type: array, items: { $ref: '#/components/schemas/Cipher' }, examples: [[none]] }
        delay_profiles:
          type: array
          items:
            type: object
            required: [profile, target_ms, available]
            properties:
              profile: { $ref: '#/components/schemas/DelayProfile' }
              target_ms: { type: integer, examples: [9500] }
              available: { type: boolean, description: "false = shown but not selectable (low can be turned off on the device)" }
          examples: [[{ profile: standard, target_ms: 9500, available: true }, { profile: low, target_ms: 1500, available: true }]]
    ApplyTransportResult:
      type: object
      required: [settings, applied_at, impacts]
      properties:
        settings: { $ref: '#/components/schemas/TransportSettings' }
        applied_at: { type: string, format: date-time }
        impacts: { type: array, items: { $ref: '#/components/schemas/Impact' } }
    CompareRow:
      type: object
      description: |
        One row per key. key=mode: local, peer (TransportMode), verdict compatible|incompatible|unknown.
        key=endpoint: local {host, port}, peer {listen_port}, verdict match|mismatch|unknown.
        key=delay: local, peer (DelayProfile), verdict match|mismatch|unknown.
        key=cipher: local, peer (Cipher), verdict match|mismatch|unknown.
        key=passphrase: local_set, verdict match|mismatch|unknown, reason peer_rejected|null.
      required: [key, verdict]
      properties:
        key: { type: string, enum: [mode, endpoint, delay, cipher, passphrase] }
        verdict: { type: string }
      additionalProperties: true
    CompareResult:
      type: object
      required: [received_at, peer_id, rows]
      properties:
        received_at: { type: [string, 'null'], format: date-time }
        peer_id: { type: [string, 'null'] }
        rows: { type: array, items: { $ref: '#/components/schemas/CompareRow' } }
    Hop:
      type: object
      description: A device on the way to the peer (途中の無線機), named by the operator.
      required: [label, address]
      properties:
        label: { type: string, minLength: 1, maxLength: 24, description: 'shown in つながりの確認; 1–24 characters (Unicode code points) after trimming', examples: ['無線機（送信機側）'] }
        address: { type: string, description: 'IPv4 address, dotted quad; no host names', examples: [192.168.0.65] }
    NetworkSettings:
      type: object
      required: [version, hops]
      properties:
        version: { type: integer }
        hops: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/Hop' }, description: 'in the order つながりの確認 shows them, after the peer' }
    NetworkSettingsInput:
      type: object
      description: |
        The whole list (it replaces the applied one). Rules, as field errors (index i from 0):
        hops: more than 4 → too_many (params max 4).
        hops[i].label: empty after trimming → required; more than 24 characters → too_long (params max 24).
        The device stores the label trimmed.
        hops[i].address: one code per field, the first that applies, in this order:
        invalid (not a dotted-quad IPv4 address, or 0.0.0.0, 255.255.255.255, 127.0.0.0/8; a host
        name is invalid too) → is_self (an address of this device) → is_peer (the peer's address:
        on tx the transport settings' peer host, on rx the configured or the last connected
        transmitter) → duplicate (the same address as an earlier item; the later item gets it).
        Impact: hops_changed (info) when the list differs from the applied one.
      required: [version, hops]
      properties:
        version: { type: integer }
        hops: { type: array, items: { $ref: '#/components/schemas/Hop' } }
    NetworkTestKind:
      type: string
      enum: [reachability, throughput]
      description: |
        reachability: whether the peer and the devices on the way answer, and their round-trip time (つながりの確認).
        throughput: how fast data gets through to or from the peer (回線の速さ). tx only, only while stopped.
    NetworkTestDirection:
      type: string
      enum: [to_peer, from_peer]
      description: to_peer = this device → the peer (on tx the video's direction); from_peer = the peer → this device
    NetworkTestRequest:
      type: object
      description: |
        Fields other than kind apply to throughput only and are ignored for reachability. Omitted fields
        take the defaults. mode and rate_mbps (fields of an earlier version) are ignored if sent.
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/NetworkTestKind' }
        direction: { $ref: '#/components/schemas/NetworkTestDirection', description: default to_peer }
        duration_s: { type: integer, minimum: 5, maximum: 30, default: 10 }
    NetworkTestParams:
      type: object
      description: The request as the device runs it, defaults filled in; null where a field does not apply.
      required: [kind, direction, duration_s]
      properties:
        kind: { $ref: '#/components/schemas/NetworkTestKind' }
        direction: { oneOf: [{ $ref: '#/components/schemas/NetworkTestDirection' }, { type: 'null' }], description: null for reachability }
        duration_s: { type: [integer, 'null'], description: null for reachability }
    NetworkTestOptions:
      type: object
      required: [duration_range_s, saturate_mbps]
      properties:
        duration_range_s: { type: array, items: { type: integer }, minItems: 2, maxItems: 2, examples: [[5, 30]] }
        saturate_mbps: { type: number, description: 'what the throughput test sends (Mbps), more than the line is expected to carry; set on the device (2–50), not from the UI', examples: [6] }
    ReachabilityTarget:
      type: object
      required: [kind, label, address, sent, received, rtt_min_ms, rtt_avg_ms, rtt_max_ms]
      properties:
        kind: { type: string, enum: [peer, hop], description: 'peer: the other device (the UI names it 受信機 / 送信機); hop: a device on the way (NetworkSettings.hops), named by label' }
        label: { type: [string, 'null'], description: 'hop: Hop.label; peer: null', examples: ['無線機（送信機側）'] }
        address: { type: string, examples: [192.168.0.65] }
        sent: { type: integer, examples: [10] }
        received: { type: integer, examples: [10] }
        rtt_min_ms: { type: [number, 'null'], description: null when nothing came back }
        rtt_avg_ms: { type: [number, 'null'] }
        rtt_max_ms: { type: [number, 'null'] }
    ReachabilityResult:
      type: object
      description: |
        The peer first, then the devices on the way in the order of NetworkSettings.hops (the list
        applied when the test started). The peer is left out
        when its address is not known (rx before any transmitter connected, no address configured);
        the list can be empty.
      required: [targets]
      properties:
        targets: { type: array, items: { $ref: '#/components/schemas/ReachabilityTarget' } }
    ThroughputResult:
      type: object
      description: |
        The test sends at about saturate_mbps, more than the line can carry; what arrives is the
        line's speed and losses are expected (not a fault). saturated=false: the line took (nearly)
        everything, it is faster than the test; the UI shows "at least saturate_mbps".
      required: [throughput_mbps, sent_mbps, loss_pct, jitter_ms, saturated, per_second_mbps]
      properties:
        throughput_mbps: { type: number, description: '届いた速さ: what arrived at the receiving side (Mbps)', examples: [5.26] }
        sent_mbps: { type: number, description: what was sent (Mbps), examples: [6.0] }
        loss_pct: { type: number, description: share of what was sent that did not arrive, examples: [5.8] }
        jitter_ms: { type: number, description: variation of the delay }
        saturated: { type: boolean, description: 'loss_pct ≥ 1: the line was full, throughput_mbps is its speed' }
        per_second_mbps: { type: array, items: { type: number }, description: what arrived in each second, oldest first }
    NetworkTestError:
      type: string
      enum: [peer_unreachable, peer_busy, failed]
      description: |
        peer_unreachable: the peer could not be reached (no route, no answer, refused).
        peer_busy: the peer is answering another test. failed: anything else (details only in the developer log).
    NetworkTest:
      type: object
      description: |
        result is null while running (follow progress) and when failed. kind=reachability →
        ReachabilityResult, kind=throughput → ThroughputResult.
      required: [id, kind, state, started_at, finished_at, progress, request, result, error]
      properties:
        id: { type: string, description: opaque }
        kind: { $ref: '#/components/schemas/NetworkTestKind' }
        state: { type: string, enum: [running, done, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time, description: null while running }
        progress: { type: number, minimum: 0, maximum: 1 }
        request: { $ref: '#/components/schemas/NetworkTestParams' }
        result:
          oneOf:
            - { $ref: '#/components/schemas/ReachabilityResult' }
            - { $ref: '#/components/schemas/ThroughputResult' }
            - { type: 'null' }
        error: { oneOf: [{ $ref: '#/components/schemas/NetworkTestError' }, { type: 'null' }], description: set when failed }
    NetworkTestList:
      type: object
      required: [items]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/NetworkTest' }, description: newest first }
